<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>গ্রাহক প্রোফাইল ও সেটিংস - Smart Banking PLC</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=3.8">
</head>
<body>
  <div class="app-layout">
    <div id="app-sidebar"></div>

    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="top-nav-left">
          <h2 style="font-size:1.25rem; font-weight:800; color:#0f172a; margin:0;" data-bn="👤 গ্রাহক প্রোফাইল ও কেওয়াইসি তথ্য" data-en="👤 Customer Profile & KYC Details">👤 গ্রাহক প্রোফাইল ও কেওয়াইসি তথ্য</h2>
        </div>
        <div class="top-nav-right">
          <span class="badge" id="profKycBadge">Loading...</span>
        </div>
      </header>

      <main class="content-container" style="max-width: 820px;">
        <!-- Banking Account Summary Box -->
        <div style="background:linear-gradient(135deg, #0284c7, #0369a1); color:#fff; border-radius:12px; padding:20px 24px; margin-bottom:24px; box-shadow:0 4px 12px rgba(2,132,199,0.2);">
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
            <div>
              <div style="font-size:0.8rem; opacity:0.85;" data-bn="অ্যাকাউন্ট নম্বর:" data-en="Account Number:">অ্যাকাউন্ট নম্বর:</div>
              <div style="font-size:1.4rem; font-weight:800; letter-spacing:1px;" id="topAccDisplay">Loading...</div>
              <div style="font-size:0.85rem; opacity:0.9; margin-top:2px;" id="topAccType">Prime Savings Account</div>
            </div>
            <div style="text-align:right;">
              <div style="font-size:0.8rem; opacity:0.85;" data-bn="মোট ব্যালেন্স:" data-en="Total Balance:">মোট ব্যালেন্স:</div>
              <div style="font-size:1.5rem; font-weight:800;" id="topBalDisplay">0.00 BDT</div>
              <div style="margin-top:6px;">
                <a href="/customer/deposit.html" class="btn btn-secondary btn-sm" style="background:#fff; color:#0284c7; font-weight:700;" data-bn="+ ডিপোজিট জমা দিন" data-en="+ Make Deposit">+ ডিপোজিট জমা দিন</a>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h3 class="card-title" data-bn="ব্যক্তিগত ও ব্যাংকিং তথ্যাবলী" data-en="Personal & Banking Information">ব্যক্তিগত ও ব্যাংকিং তথ্যাবলী</h3>
            <a href="/customer/kyc.html" class="table-action-btn secondary" data-bn="🪪 কেওয়াইসি ডকুমেন্টস দেখুন &rarr;" data-en="🪪 View KYC Documents &rarr;">🪪 কেওয়াইসি ডকুমেন্টস দেখুন &rarr;</a>
          </div>
          <div class="card-body">
            <form id="profileForm">
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                <div class="form-group">
                  <label class="form-label" data-bn="গ্রাহক রেফারেন্স আইডি" data-en="Customer Reference ID">গ্রাহক রেফারেন্স আইডি</label>
                  <input type="text" id="profRef" class="form-control" readonly disabled style="background:#f1f5f9;">
                </div>
                <div class="form-group">
                  <label class="form-label" data-bn="অ্যাকাউন্ট নম্বর" data-en="Account Number">অ্যাকাউন্ট নম্বর</label>
                  <input type="text" id="profAcc" class="form-control" readonly disabled style="background:#f1f5f9;">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label required" data-bn="আবেদনকারীর পূর্ণ নাম" data-en="Full Legal Name">আবেদনকারীর পূর্ণ নাম</label>
                <input type="text" id="profName" class="form-control" required>
              </div>

              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                <div class="form-group">
                  <label class="form-label" data-bn="নিবন্ধিত ইমেইল" data-en="Registered Email">নিবন্ধিত ইমেইল</label>
                  <input type="email" id="profEmail" class="form-control" readonly disabled style="background:#f1f5f9;">
                </div>
                <div class="form-group">
                  <label class="form-label" data-bn="মোবাইল নম্বর" data-en="Mobile Number">মোবাইল নম্বর</label>
                  <input type="tel" id="profPhone" class="form-control" placeholder="017XXXXXXXX">
                </div>
              </div>

              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:16px;">
                <div class="form-group">
                  <label class="form-label" data-bn="পিতার নাম" data-en="Father's Name">পিতার নাম</label>
                  <input type="text" id="profFather" class="form-control" readonly disabled style="background:#f1f5f9;">
                </div>
                <div class="form-group">
                  <label class="form-label" data-bn="মাতার নাম" data-en="Mother's Name">মাতার নাম</label>
                  <input type="text" id="profMother" class="form-control" readonly disabled style="background:#f1f5f9;">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label" data-bn="বর্তমান বসবাসের ঠিকানা" data-en="Present Address">বর্তমান বসবাসের ঠিকানা</label>
                <textarea id="profAddress" class="form-control" style="min-height:80px;" data-bn="বর্তমান ঠিকানা" data-en="Present residential address"></textarea>
              </div>

              <div style="display:flex; justify-content:flex-end;">
                <button type="submit" id="saveBtn" class="btn btn-primary" data-bn="তথ্য সংরক্ষণ করুন" data-en="Save Changes">
                  তথ্য সংরক্ষণ করুন
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/api.js?v=3.8"></script>
  <script src="/assets/js/auth.js?v=3.8"></script>
  <script src="/assets/js/common.js?v=3.8"></script>
  <script>
    window.Auth.requireAuth('CUSTOMER');
    window.UI.renderCustomerSidebar('profile');

    async function loadProfile() {
      try {
        const res = await window.api.get('/api/auth/me');
        const u = res.user || {};
        const cust = u.customer || u;

        document.getElementById('topAccDisplay').innerText = cust.account_number || 'N/A';
        document.getElementById('topAccType').innerText = cust.account_type || 'Prime Savings Account';
        document.getElementById('topBalDisplay').innerText = `${parseFloat(cust.balance || 0).toFixed(2)} BDT`;

        document.getElementById('profRef').value = cust.customer_reference || '-';
        document.getElementById('profAcc').value = cust.account_number || '-';
        document.getElementById('profName').value = u.full_name || '';
        document.getElementById('profEmail').value = u.email || '';
        document.getElementById('profPhone').value = u.phone || '';
        document.getElementById('profFather').value = cust.father_name || 'N/A';
        document.getElementById('profMother').value = cust.mother_name || 'N/A';
        document.getElementById('profAddress').value = cust.address || '';

        const lang = window.UI ? window.UI.getLanguage() : 'bn';
        const isBn = lang === 'bn';
        const rawStatus = cust.kyc_status || u.kyc_status || 'Pending';
        const status = String(rawStatus).trim();
        const norm = status.toLowerCase();
        const badge = document.getElementById('profKycBadge');
        if (norm === 'approved') {
          badge.innerText = isBn ? 'কেওয়াইসি: অনুমোদিত' : 'KYC: Approved';
          badge.className = 'badge badge-approved';
        } else if (norm === 'rejected') {
          badge.innerText = isBn ? 'কেওয়াইসি: বাতিলকৃত' : 'KYC: Rejected';
          badge.className = 'badge badge-rejected';
        } else if (norm.includes('document')) {
          badge.innerText = isBn ? 'কেওয়াইসি: অতিরিক্ত ডকুমেন্ট আবশ্যক' : 'KYC: Documents Required';
          badge.className = 'badge badge-warning';
        } else {
          badge.innerText = isBn ? 'কেওয়াইসি: পর্যালোচনায়' : 'KYC: Pending';
          badge.className = 'badge badge-submitted';
        }
      } catch (err) {
        window.showToast('প্রোফাইল লোড করা যায়নি।', 'error');
      }
    }

    document.getElementById('profileForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('saveBtn');

      const payload = {
        full_name: document.getElementById('profName').value,
        phone: document.getElementById('profPhone').value,
        address: document.getElementById('profAddress').value,
      };

      const isBn = window.UI ? window.UI.getLanguage() === 'bn' : false;

      try {
        btn.disabled = true;
        btn.innerText = isBn ? 'সংরক্ষণ হচ্ছে...' : 'Saving...';

        await window.api.patch('/api/auth/me', payload);
        window.showToast(isBn ? '✅ প্রোফাইল সফলভাবে আপডেট করা হয়েছে।' : '✅ Profile updated successfully.', 'success');
      } catch (err) {
        window.showToast(err.message || (isBn ? 'আপডেট ব্যর্থ হয়েছে।' : 'Failed to update profile.'), 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = btn.getAttribute(`data-${isBn ? 'bn' : 'en'}`) || (isBn ? 'তথ্য সংরক্ষণ করুন' : 'Save Changes');
      }
    });

    loadProfile();
  </script>
</body>
</html>
