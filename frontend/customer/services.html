<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Banking Services Catalogue - Smart Banking Portal</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .service-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
    }
    .service-box {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .service-box:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }
    .service-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }
    .service-name {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--navy);
      line-height: 1.3;
    }
    .service-cat {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      background: var(--primary-light);
      color: var(--primary);
      padding: 3px 8px;
      border-radius: 999px;
    }
    .service-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 16px;
      flex: 1;
    }
    .service-meta {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-bottom: 16px;
      border-top: 1px dashed var(--border);
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="app-sidebar"></div>

    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="top-nav-left">
          <h1 class="page-heading">Banking Services Catalogue</h1>
        </div>
        <div class="top-nav-right">
          <a href="/customer/service-request.html" class="btn btn-primary btn-sm">+ Apply for Service</a>
        </div>
      </header>

      <main class="content-container">
        <div style="margin-bottom: 24px;">
          <p style="color:var(--text-muted); font-size: 0.95rem;">
            Browse official digital banking services. Select any service to view required documents or submit an application online.
          </p>
        </div>

        <div id="servicesGrid" class="service-card-grid">
          <div style="grid-column: 1/-1; text-align:center; padding: 40px; color:var(--text-muted);">
            Loading services catalogue...
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/common.js"></script>
  <script>
    window.Auth.requireAuth('CUSTOMER');
    window.UI.renderCustomerSidebar('services');

    async function loadServices() {
      try {
        const res = await window.api.get('/api/services');
        const services = res.services || [];
        const container = document.getElementById('servicesGrid');

        container.innerHTML = services.map(s => `
          <div class="service-box">
            <div class="service-header">
              <span class="service-cat">${s.category || 'Banking'}</span>
              <span style="font-size:0.78rem; color:var(--text-light);">Code: ${s.service_code}</span>
            </div>
            <h3 class="service-name">${s.name}</h3>
            <p class="service-desc">${s.description}</p>
            <div class="service-meta">
              ⏱ Standard Turnaround: <strong>${s.processing_time_days} business days</strong>
            </div>
            <a href="/customer/service-request.html?serviceId=${s.id}" class="btn btn-primary btn-block">
              Apply for this Service &rarr;
            </a>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
        window.showToast('Failed to load services catalogue.', 'error');
      }
    }

    loadServices();
  </script>
</body>
</html>
