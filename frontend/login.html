<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>গ্রাহক ইন্টারনেট ব্যাংকিং লগইন - Smart Banking PLC</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=3.3">
</head>
<body class="auth-page">
  <div class="auth-card" style="max-width: 440px;">
    <div class="auth-header">
      <div class="auth-brand">
        <div class="brand-icon">SB</div>
        <span class="brand-text" style="font-size: 1.25rem;">Smart Banking</span>
      </div>
      <h2 class="auth-title" data-bn="গ্রাহক ইন্টারনেট ব্যাংকিং" data-en="Customer Internet Banking">গ্রাহক ইন্টারনেট ব্যাংকিং</h2>
      <p class="auth-sub" data-bn="আপনার ব্যাংকিং অ্যাকাউন্ট ও ডিজিটাল সেবা ব্যবস্থাপনায় প্রবেশ করুন" data-en="Sign in to your banking account and digital services">আপনার ব্যাংকিং অ্যাকাউন্ট ও ডিজিটাল সেবা ব্যবস্থাপনায় প্রবেশ করুন</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label class="form-label required" data-bn="ইমেইল ঠিকানা" data-en="Email Address">ইমেইল ঠিকানা</label>
        <input type="email" id="email" class="form-control" placeholder="user@example.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label required" data-bn="পাসওয়ার্ড" data-en="Password">পাসওয়ার্ড</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg" style="font-weight:700; margin-top:20px;" data-bn="🔑 লগইন করুন" data-en="🔑 Sign In">
        🔑 লগইন করুন
      </button>
    </form>

    <div class="auth-footer" style="margin-top:24px;">
      <span data-bn="নতুন গ্রাহক?" data-en="New to Smart Banking?">নতুন গ্রাহক?</span> <a href="/register.html" style="color:#0284c7; font-weight:700;" data-bn="এখানে নতুন অ্যাকাউন্ট খুলুন" data-en="Open an Account here">এখানে নতুন অ্যাকাউন্ট খুলুন</a><br><br>
      <a href="/admin-login.html" style="font-size: 0.85rem; color: #64748b;" data-bn="ব্যাংক অফিসার পোর্টাল লগইন &rarr;" data-en="Bank Officer Portal Login &rarr;">ব্যাংক অফিসার পোর্টাল লগইন &rarr;</a>
    </div>
  </div>

  <script src="/assets/js/api.js?v=3.3"></script>
  <script src="/assets/js/auth.js?v=3.3"></script>
  <script src="/assets/js/common.js?v=3.3"></script>
  <script>
    window.Auth.redirectIfAuthenticated();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const isBn = window.UI ? window.UI.getLanguage() === 'bn' : false;

      try {
        btn.disabled = true;
        btn.innerText = isBn ? 'যাচাই করা হচ্ছে...' : 'Verifying...';

        const res = await window.api.post('/api/auth/login', { email, password });

        window.api.setToken(res.token);
        window.api.setUser(res.user);

        window.showToast(isBn ? '✅ লগইন সফল হয়েছে!' : '✅ Logged in successfully!', 'success');

        setTimeout(() => {
          if (res.user.role === 'ADMIN') {
            window.location.href = '/admin/admin-dashboard.html';
          } else {
            window.location.href = '/customer/dashboard.html';
          }
        }, 500);
      } catch (err) {
        window.showToast(err.message || (isBn ? 'ভুল ইমেইল বা পাসওয়ার্ড।' : 'Invalid email or password.'), 'error');
        btn.disabled = false;
        btn.innerHTML = btn.getAttribute(`data-${isBn ? 'bn' : 'en'}`) || (isBn ? '🔑 লগইন করুন' : '🔑 Sign In');
      }
    });
  </script>
</body>
</html>
