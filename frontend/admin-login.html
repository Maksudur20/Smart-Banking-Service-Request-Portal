<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ব্যাংক অফিসার পোর্টাল লগইন - Smart Banking PLC</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=3.1">
</head>
<body class="auth-page">
  <div class="auth-card" style="max-width: 440px;">
    <div class="auth-header">
      <div class="auth-brand">
        <div class="brand-icon" style="background: linear-gradient(135deg, #0ea5e9, #0284c7);">SB</div>
        <span class="brand-text" style="font-size: 1.25rem;">Smart Banking</span>
      </div>
      <h2 class="auth-title" data-bn="ব্যাংক অফিসার পোর্টাল" data-en="Bank Officer Portal">ব্যাংক অফিসার পোর্টাল</h2>
      <p class="auth-sub" data-bn="কেওয়াইসি ভেরিফিকেশন, ডিপোজিট অনুমোদন ও প্রশাসনিক নিয়ন্ত্রণ" data-en="KYC verification, deposit approval and administration">কেওয়াইসি ভেরিফিকেশন, ডিপোজিট অনুমোদন ও প্রশাসনিক নিয়ন্ত্রণ</p>
    </div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label class="form-label required" data-bn="অফিসার ইমেইল" data-en="Officer Email">অফিসার ইমেইল</label>
        <input type="email" id="email" class="form-control" placeholder="admin@smartbank.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label required" data-bn="পাসওয়ার্ড" data-en="Password">পাসওয়ার্ড</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary btn-block btn-lg" style="background:#0284c7; font-weight:700; margin-top:20px;" data-bn="🛡️ অফিসার পোর্টালে প্রবেশ করুন" data-en="🛡️ Access Officer Portal">
        🛡️ অফিসার পোর্টালে প্রবেশ করুন
      </button>
    </form>

    <div class="auth-footer" style="margin-top:24px;">
      <a href="/login.html" style="color:#64748b; font-size:0.85rem;" data-bn="&larr; গ্রাহক ইন্টারনেট ব্যাংকিং লগইন পেজে ফিরে যান" data-en="&larr; Return to Customer Banking Login">&larr; গ্রাহক ইন্টারনেট ব্যাংকিং লগইন পেজে ফিরে যান</a>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js?v=3.1"></script>
  <script src="/assets/js/common.js?v=3.1"></script>
  <script>
    window.Auth.redirectIfAuthenticated();

    document.getElementById('adminLoginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        btn.disabled = true;
        btn.innerText = 'যাচাই করা হচ্ছে...';

        const res = await window.api.post('/api/auth/login', { email, password });

        if (res.user.role !== 'ADMIN') {
          throw new Error('অ্যাক্সেস প্রত্যাখ্যান করা হয়েছে। এই অ্যাকাউন্টে ব্যাংক অফিসারের অনুমোদন নেই।');
        }

        window.api.setToken(res.token);
        window.api.setUser(res.user);

        window.showToast('✅ অফিসার প্রমাণীকরণ সফল হয়েছে!', 'success');

        setTimeout(() => {
          window.location.href = '/admin/admin-dashboard.html';
        }, 500);
      } catch (err) {
        window.showToast(err.message || 'ভুল ইমেইল বা পাসওয়ার্ড।', 'error');
        btn.disabled = false;
        btn.innerText = '🛡️ অফিসার পোর্টালে প্রবেশ করুন';
      }
    });
  </script>
</body>
</html>
