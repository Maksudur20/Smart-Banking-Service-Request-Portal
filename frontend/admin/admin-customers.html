<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>গ্রাহক ডিরেক্টরি - Smart Banking PLC Admin</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=2.9">
</head>
<body>
  <div class="app-layout">
    <div id="app-sidebar"></div>

    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="top-nav-left">
          <h2 style="font-size:1.25rem; font-weight:800; color:#0f172a; margin:0;" data-bn="👥 নিবন্ধিত গ্রাহক তালিকা" data-en="👥 Registered Customer Directory">👥 নিবন্ধিত গ্রাহক তালিকা</h2>
        </div>
        <div class="top-nav-right">
          <span style="font-size:0.85rem; color:#64748b;">রিয়েল-টাইম গ্রাহক ও ব্যালেন্স তথ্য</span>
        </div>
      </header>

      <main class="content-container">
        <div class="card">
          <div class="card-header" style="flex-wrap:wrap; gap:16px;">
            <div>
              <h3 class="card-title">সকল ব্যাংক গ্রাহক</h3>
              <p class="card-subtitle">নাম, অ্যাকাউন্ট নম্বর বা কাস্টমার রেফারেন্স দিয়ে অনুসন্ধান করুন</p>
            </div>
            <div>
              <input type="text" id="custSearch" class="form-control" placeholder="গ্রাহক অনুসন্ধান করুন..." style="width:260px; padding:6px 12px; font-size:0.85rem;">
            </div>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th data-bn="গ্রাহক রেফারেন্স" data-en="Reference">গ্রাহক রেফারেন্স</th>
                  <th data-bn="নাম ও যোগাযোগ" data-en="Name & Contact">নাম ও যোগাযোগ</th>
                  <th data-bn="অ্যাকাউন্ট নম্বর" data-en="Account Number">অ্যাকাউন্ট নম্বর</th>
                  <th data-bn="অ্যাকাউন্টের ধরন" data-en="Account Type">অ্যাকাউন্টের ধরন</th>
                  <th data-bn="ব্যালেন্স" data-en="Balance">ব্যালেন্স</th>
                  <th data-bn="কেওয়াইসি স্ট্যাটাস" data-en="KYC Status">কেওয়াইসি স্ট্যাটাস</th>
                  <th data-bn="রেজিস্ট্রেশন তারিখ" data-en="Registered On">রেজিস্ট্রেশন তারিখ</th>
                  <th data-bn="অ্যাকশন" data-en="Action">অ্যাকশন</th>
                </tr>
              </thead>
              <tbody id="customersTableBody">
                <tr>
                  <td colspan="8" style="text-align:center; padding:32px; color:var(--text-light);">গ্রাহক তালিকা লোড হচ্ছে...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js?v=2.9"></script>
  <script src="/assets/js/common.js?v=2.9"></script>
  <script>
    window.Auth.requireAuth('ADMIN');
    window.UI.renderAdminSidebar('customers');

    async function loadCustomers() {
      const search = document.getElementById('custSearch').value;
      const lang = window.UI ? window.UI.getLanguage() : 'bn';
      const isBn = lang === 'bn';
      const params = {};
      if (search) params.search = search;

      try {
        const res = await window.api.get('/api/admin/customers', params);
        const list = res.customers || [];
        const tbody = document.getElementById('customersTableBody');

        if (list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:32px; color:var(--text-muted);">${isBn ? 'কোনো গ্রাহক পাওয়া যায়নি।' : 'No customers found.'}</td></tr>`;
          return;
        }

        tbody.innerHTML = list.map(c => {
          let badgeClass = 'badge-submitted';
          if (c.kyc_status === 'Approved') badgeClass = 'badge-approved';
          if (c.kyc_status === 'Rejected') badgeClass = 'badge-rejected';

          return `
            <tr>
              <td><code>${c.customer_reference || '-'}</code></td>
              <td>
                <div style="font-weight:700; color:#0f172a; font-size:0.92rem;">${c.full_name}</div>
                <div style="font-size:0.78rem; color:#64748b; margin-top:2px;">${c.email} &bull; ${c.phone || '-'}</div>
              </td>
              <td><span style="font-family:ui-monospace, monospace; font-weight:700; color:#0369a1; font-size:0.9rem;">${c.account_number || 'N/A'}</span></td>
              <td><span style="color:#475569; font-weight:500;">${c.account_type || 'Prime Savings'}</span></td>
              <td><span style="font-weight:800; color:#059669; font-size:0.95rem;">৳${Number(c.balance || 0).toLocaleString('en-US', {minimumFractionDigits: 2})}</span></td>
              <td><span class="badge ${badgeClass}">${c.kyc_status || 'Pending'}</span></td>
              <td style="font-size:0.82rem; color:#64748b; font-weight:500;">${new Date(c.created_at).toLocaleDateString()}</td>
              <td>
                <a href="/admin/admin-kyc.html?customerId=${c.id}" class="table-action-btn primary">
                  ${isBn ? 'কেওয়াইসি রিভিউ &rarr;' : 'Review KYC &rarr;'}
                </a>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        window.showToast('গ্রাহক তালিকা লোড করা যায়নি।', 'error');
      }
    }

    document.getElementById('custSearch').addEventListener('input', () => {
      clearTimeout(window._searchTimer);
      window._searchTimer = setTimeout(loadCustomers, 350);
    });

    loadCustomers();
  </script>
</body>
</html>
