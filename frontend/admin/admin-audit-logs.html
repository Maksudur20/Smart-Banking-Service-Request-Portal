<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audit Logs - Smart Banking Portal</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=2.4">
</head>
<body>
  <div class="app-layout">
    <div id="app-sidebar"></div>

    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="top-nav-left">
          <h1 class="page-heading">Security Audit Logs & Compliance Trail</h1>
        </div>
      </header>

      <main class="content-container">
        <div class="card">
          <div class="card-header">
            <div>
              <h3 class="card-title">Immutable Administrative Audit Log</h3>
              <p class="card-subtitle">Chronological record of logins, status transitions, and administrative decisions</p>
            </div>
          </div>
          <div class="table-responsive">
            <table class="table">
              <thead>
                <tr>
                  <th>Timestamp</th>
                  <th>Actor / Officer</th>
                  <th>Action</th>
                  <th>Entity</th>
                  <th>Target ID</th>
                  <th>IP Address</th>
                  <th>Audit Metadata</th>
                </tr>
              </thead>
              <tbody id="auditTableBody">
                <tr>
                  <td colspan="7" style="text-align:center; padding:30px; color:var(--text-light);">Loading audit logs...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js?v=2.4"></script>
  <script src="/assets/js/common.js?v=2.4"></script>
  <script>
    window.Auth.requireAuth('ADMIN');
    window.UI.renderAdminSidebar('audit');

    async function loadAuditLogs() {
      try {
        const res = await window.api.get('/api/reports/audit-logs', { limit: 40 });
        const list = res.logs || [];
        const tbody = document.getElementById('auditTableBody');

        if (list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:30px; color:var(--text-muted);">No audit records found.</td></tr>';
          return;
        }

        tbody.innerHTML = list.map(l => `
          <tr>
            <td style="font-size:0.8rem; color:var(--text-light);">${window.UI.formatDateTime(l.created_at)}</td>
            <td><strong>${l.actor_name || 'System / Anonymous'}</strong></td>
            <td><span class="badge badge-submitted">${l.action}</span></td>
            <td><code>${l.entity_type}</code></td>
            <td>${l.entity_id || 'N/A'}</td>
            <td><code>${l.ip_address || '127.0.0.1'}</code></td>
            <td style="max-width:260px; font-size:0.78rem; font-family:monospace; color:var(--text-muted); word-break:break-all;">
              ${JSON.stringify(l.details)}
            </td>
          </tr>
        `).join('');
      } catch (err) {
        window.showToast('Failed to load audit logs.', 'error');
      }
    }

    loadAuditLogs();
  </script>
</body>
</html>
