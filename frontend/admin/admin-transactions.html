<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>লাইভ লেনদেন খতিয়ান - Smart Banking PLC Admin</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=3.5">
</head>
<body>
  <div class="app-layout">
    <div id="app-sidebar"></div>

    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="top-nav-left">
          <h2 style="font-size:1.25rem; font-weight:800; color:#0f172a; margin:0;" data-bn="💳 লাইভ ব্যাংকিং ট্রানজেকশন লেজার" data-en="💳 Live Banking Transaction Ledger">💳 লাইভ ব্যাংকিং ট্রানজেকশন লেজার</h2>
        </div>
        <div class="top-nav-right">
          <span style="font-size:0.85rem; color:#64748b;" data-bn="বাস্তব জমা ও ট্রান্সফারের খতিয়ান" data-en="Real deposits and transfers ledger">বাস্তব জমা ও ট্রান্সফারের খতিয়ান</span>
        </div>
      </header>

      <main class="content-container">
        <div class="card">
          <div class="card-header" style="flex-wrap:wrap; gap:12px;">
            <div>
              <h3 class="card-title" data-bn="সকল বাস্তব ব্যাংকিং লেনদেন" data-en="All Real Banking Transactions">সকল বাস্তব ব্যাংকিং লেনদেন</h3>
              <p class="card-subtitle" data-bn="আউটগোয়িং ট্রান্সফার ও ভেরিফাইড ডিপোজিটের কেন্দ্রীয় রেজিস্টার" data-en="Central register of outgoing transfers and verified deposits">আউটগোয়িং ট্রান্সফার ও ভেরিফাইড ডিপোজিটের কেন্দ্রীয় রেজিস্টার</p>
            </div>
            <div style="display:flex; gap:10px;">
              <input type="text" id="txSearch" class="form-control" placeholder="Trx ID বা অ্যাকাউন্ট নম্বর..." style="width:220px; font-size:0.85rem;" data-bn="Trx ID বা অ্যাকাউন্ট নম্বর..." data-en="Trx ID or Account Number...">
              <select id="typeFilter" class="form-control" style="width:auto; font-size:0.85rem;">
                <option value="" data-bn="সকল ধরন" data-en="All Types">সকল ধরন</option>
                <option value="CREDIT" data-bn="ডিপোজিট / ক্রেডিট" data-en="Deposit / Credit">ডিপোজিট / ক্রেডিট</option>
                <option value="DEBIT" data-bn="ফান্ড ট্রান্সফার / ডেবিট" data-en="Fund Transfer / Debit">ফান্ড ট্রান্সফার / ডেবিট</option>
              </select>
            </div>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th data-bn="ট্রানজেকশন নম্বর" data-en="Transaction #">ট্রানজেকশন নম্বর</th>
                  <th data-bn="গ্রাহক ও অ্যাকাউন্ট" data-en="Customer & A/C">গ্রাহক ও অ্যাকাউন্ট</th>
                  <th data-bn="লেনদেনের ধরন" data-en="Type">লেনদেনের ধরন</th>
                  <th data-bn="পরিমাণ (BDT)" data-en="Amount (BDT)">পরিমাণ (BDT)</th>
                  <th data-bn="কাউন্টারপার্টি" data-en="Counterparty">কাউন্টারপার্টি</th>
                  <th data-bn="রেফারেন্স" data-en="Reference">রেফারেন্স</th>
                  <th data-bn="পরবর্তী ব্যালেন্স" data-en="Balance After">পরবর্তী ব্যালেন্স</th>
                  <th data-bn="তারিখ ও সময়" data-en="Date & Time">তারিখ ও সময়</th>
                </tr>
              </thead>
              <tbody id="txTableBody">
                <tr>
                  <td colspan="8" style="text-align:center; padding:30px; color:var(--text-light);" data-bn="লেনদেন লোড হচ্ছে..." data-en="Loading transactions...">লেনদেন লোড হচ্ছে...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/assets/js/api.js?v=3.5"></script>
  <script src="/assets/js/auth.js?v=3.5"></script>
  <script src="/assets/js/common.js?v=3.5"></script>
  <script>
    window.Auth.requireAuth('ADMIN');
    window.UI.renderAdminSidebar('transactions');

    async function loadTransactions() {
      const isBn = window.UI ? window.UI.getLanguage() === 'bn' : true;
      const type = document.getElementById('typeFilter').value;
      const search = document.getElementById('txSearch').value;
      const params = {};
      if (type) params.type = type;
      if (search) params.search = search;

      try {
        const res = await window.api.get('/api/transactions', params);
        const list = res.transactions || [];
        const tbody = document.getElementById('txTableBody');

        if (list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="8" style="text-align:center; padding:30px; color:var(--text-muted);">${isBn ? 'কোনো লেনদেন রেকর্ড পাওয়া যায়নি।' : 'No transactions recorded.'}</td></tr>`;
          return;
        }

        tbody.innerHTML = list.map(t => {
          const isCredit = t.type === 'CREDIT' || t.type === 'DEPOSIT';
          return `
            <tr>
              <td><code>${t.transaction_number}</code></td>
              <td>
                <div style="font-weight:700; color:#0f172a; font-size:0.92rem;">${t.customer_name || 'N/A'}</div>
                <div style="font-size:0.78rem; color:#64748b; margin-top:2px;">A/C: <span style="font-family:monospace; color:#0369a1; font-weight:700;">${t.account_number}</span></div>
              </td>
              <td>
                <span class="badge ${isCredit ? 'badge-approved' : 'badge-rejected'}">
                  ${isCredit ? (isBn ? 'ক্রেডিট / জমা' : 'Credit / Deposit') : (isBn ? 'ডেবিট / ট্রান্সফার' : 'Debit / Transfer')}
                </span>
              </td>
              <td style="font-weight:800; color:${isCredit ? '#059669' : '#e11d48'}; font-size:0.95rem;">
                ${isCredit ? '+' : '-'}${Number(t.amount).toLocaleString('en-US', {minimumFractionDigits: 2})} BDT
              </td>
              <td style="font-size:0.86rem; color:#334155; font-weight:500;">${t.counterparty_name || t.counterparty_account || '-'}</td>
              <td style="font-size:0.82rem; color:#64748b;">${t.reference || '-'}</td>
              <td style="font-weight:700; color:#0f172a;">${Number(t.balance_after).toLocaleString('en-US', {minimumFractionDigits: 2})} BDT</td>
              <td style="font-size:0.82rem; color:#64748b; font-weight:500;">${new Date(t.created_at).toLocaleString()}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        window.showToast(isBn ? 'লেনদেন তালিকা লোড করা যায়নি।' : 'Failed to load transactions list.', 'error');
      }
    }

    document.getElementById('typeFilter').addEventListener('change', loadTransactions);
    document.getElementById('txSearch').addEventListener('input', () => {
      clearTimeout(window._searchTimer);
      window._searchTimer = setTimeout(loadTransactions, 350);
    });

    loadTransactions();
  </script>
</body>
</html>
