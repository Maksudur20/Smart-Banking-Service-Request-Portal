<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ডিপোজিট ভেরিফিকেশন ডেস্ক - Smart Banking PLC Admin</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=2.2">
  <style>
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.open {
      display: flex;
    }
    .modal-box {
      background: #fff;
      border-radius: 12px;
      max-width: 650px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
    }
    .slip-zoom {
      width: 100%;
      max-height: 320px;
      object-fit: contain;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      margin: 12px 0;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <div id="app-sidebar"></div>

    <div class="main-wrapper">
      <header class="top-navbar">
        <div class="top-nav-left">
          <h2 style="font-size:1.25rem; font-weight:800; color:#0f172a; margin:0;">💵 ডিপোজিট ভেরিফিকেশন কিউ (Deposit Verifications)</h2>
        </div>
        <div class="top-nav-right">
          <span style="font-size:0.85rem; color:#64748b;">ক্যাশ ও মোবাইল ব্যাংকিং স্লিপ ভেরিফিকেশন</span>
        </div>
      </header>

      <main class="content-container">
        <!-- Deposit Queue Table -->
        <div class="card">
          <div class="card-header">
            <h3 class="card-title">পেন্ডিং ও বিগত ডিপোজিট রিকোয়েস্টসমূহ</h3>
            <button onclick="loadDeposits()" class="btn btn-secondary btn-sm">🔄 রিফ্রেশ</button>
          </div>
          <div class="card-body" style="padding:0;">
            <div id="depositsTableContainer">
              <p style="padding:30px; text-align:center; color:#94a3b8;">লোড হচ্ছে...</p>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Deposit Verification Modal -->
  <div id="depositModal" class="modal-overlay">
    <div class="modal-box">
      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e2e8f0; padding-bottom:10px;">
        <h3 style="margin:0; font-size:1.15rem; font-weight:700; color:#0f172a;" id="modalDepositTitle">ডিপোজিট স্লিপ যাচাই</h3>
        <button onclick="closeDepositModal()" class="table-action-btn secondary" style="font-size:1.2rem; padding:2px 10px;">&times;</button>
      </div>

      <div id="modalDepositDetails" style="margin-top:14px; font-size:0.85rem; line-height:1.6; background:#f8fafc; padding:12px; border-radius:6px;">
        <!-- Injected by JS -->
      </div>

      <div>
        <h4 style="margin:12px 0 4px 0; font-size:0.9rem;">সংযুক্ত ডিপোজিট স্লিপ / রিসিট:</h4>
        <div id="modalSlipContainer">
          <!-- Injected by JS -->
        </div>
      </div>

      <div class="form-group" style="margin-top:14px;">
        <label class="form-label">অ্যাডমিন রিমার্কস (Remarks):</label>
        <textarea id="depositRemarks" class="form-control" rows="2" placeholder="বাতিলের ক্ষেত্রে কারণ উল্লেখ করুন"></textarea>
      </div>

      <div style="display:flex; justify-content:flex-end; gap:12px; margin-top:16px;">
        <button onclick="verifyDeposit('REJECT')" class="btn btn-secondary" style="background:#fef2f2; color:#dc2626; border-color:#fca5a5;">
          ❌ Reject Deposit
        </button>
        <button onclick="verifyDeposit('ACCEPT')" class="btn btn-primary" style="background:#059669; border-color:#059669;">
          ✅ Accept & Credit Balance Atomically
        </button>
      </div>
    </div>
  </div>

  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/auth.js"></script>
  <script src="/assets/js/common.js?v=2.2"></script>
  <script>
    window.Auth.requireAuth('ADMIN');
    window.UI.renderAdminSidebar('deposits');

    let depositList = [];
    let selectedDeposit = null;

    async function loadDeposits() {
      const container = document.getElementById('depositsTableContainer');
      try {
        const res = await window.api.get('/api/deposits/admin');
        depositList = res.deposits || [];

        if (depositList.length === 0) {
          container.innerHTML = `<p style="padding:30px; text-align:center; color:#94a3b8;">কোনো ডিপোজিট রিকোয়েস্ট পাওয়া যায়নি।</p>`;
          return;
        }

        container.innerHTML = `
          <div class="table-responsive">
            <table class="data-table">
              <thead>
                <tr>
                  <th>আইডি</th>
                  <th>গ্রাহক ও অ্যাকাউন্ট</th>
                  <th>পরিমাণ</th>
                  <th>পদ্ধতি</th>
                  <th>TrxID</th>
                  <th>প্রেরক</th>
                  <th>স্ট্যাটাস</th>
                  <th>তারিখ</th>
                  <th>অ্যাকশন</th>
                </tr>
              </thead>
              <tbody>
                ${depositList.map(d => {
                  let badgeClass = 'badge-submitted';
                  if (d.status === 'Approved') badgeClass = 'badge-approved';
                  if (d.status === 'Rejected') badgeClass = 'badge-rejected';

                  return `
                    <tr>
                      <td><strong>${d.deposit_number}</strong></td>
                      <td>
                        <div style="font-weight:700; color:#0f172a;">${d.customer_name}</div>
                        <div style="font-size:0.75rem; color:#0284c7;">A/C: ${d.account_number}</div>
                      </td>
                      <td style="font-weight:800; color:#10b981; font-size:1rem;">${parseFloat(d.amount).toFixed(2)} BDT</td>
                      <td><span style="font-weight:600;">${d.deposit_method}</span></td>
                      <td><code style="background:#f1f5f9; padding:3px 8px; border-radius:4px; font-weight:700; border:1px solid #e2e8f0;">${d.transaction_id}</code></td>
                      <td style="font-size:0.82rem;"><strong>${d.sender_name}</strong><br><span style="color:#64748b;">${d.sender_mobile}</span></td>
                      <td><span class="badge ${badgeClass}">${d.status}</span></td>
                      <td style="font-size:0.8rem; color:#64748b;">${new Date(d.created_at).toLocaleDateString()}</td>
                      <td>
                        ${d.status === 'Pending Verification' ? `
                          <button onclick="openDepositModal(${d.id})" class="table-action-btn primary">
                            যাচাই ও ক্রেডিট
                          </button>
                        ` : `
                          <button onclick="openDepositModal(${d.id})" class="table-action-btn secondary">
                            স্লিপ দেখুন
                          </button>
                        `}
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<p style="padding:20px; color:#ef4444; text-align:center;">ডিপোজিট লোড করা যায়নি।</p>`;
      }
    }

    function openDepositModal(depositId) {
      selectedDeposit = depositList.find(d => d.id === depositId);
      if (!selectedDeposit) return;

      document.getElementById('modalDepositTitle').innerText = `ডিপোজিট যাচাই — ${selectedDeposit.deposit_number}`;
      document.getElementById('depositRemarks').value = selectedDeposit.admin_remarks || '';

      document.getElementById('modalDepositDetails').innerHTML = `
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px;">
          <div><strong>গ্রাহকের নাম:</strong> ${selectedDeposit.customer_name}</div>
          <div><strong>অ্যাকাউন্ট নম্বর:</strong> ${selectedDeposit.account_number}</div>
          <div><strong>জমার পরিমাণ:</strong> <span style="font-size:1.1rem; color:#10b981; font-weight:800;">${parseFloat(selectedDeposit.amount).toFixed(2)} BDT</span></div>
          <div><strong>পদ্ধতি:</strong> ${selectedDeposit.deposit_method}</div>
          <div><strong>TrxID:</strong> <code style="font-weight:700;">${selectedDeposit.transaction_id}</code></div>
          <div><strong>প্রেরক:</strong> ${selectedDeposit.sender_name} (${selectedDeposit.sender_mobile})</div>
          <div><strong>জমার তারিখ:</strong> ${selectedDeposit.deposit_date}</div>
          <div><strong>বর্তমান স্ট্যাটাস:</strong> ${selectedDeposit.status}</div>
        </div>
      `;

      const slipBox = document.getElementById('modalSlipContainer');
      if (selectedDeposit.slip_url) {
        slipBox.innerHTML = `
          <img src="${selectedDeposit.slip_url}" alt="Slip" class="slip-zoom">
          <div style="text-align:right;">
            <a href="${selectedDeposit.slip_url}" target="_blank" class="table-action-btn secondary">পূর্ণাঙ্গ স্লিপ খুলুন ↗</a>
          </div>
        `;
      } else {
        slipBox.innerHTML = `<p style="color:#94a3b8;">কোনো স্লিপ পাওয়া যায়নি।</p>`;
      }

      document.getElementById('depositModal').classList.add('open');
    }

    function closeDepositModal() {
      document.getElementById('depositModal').classList.remove('open');
      selectedDeposit = null;
    }

    async function verifyDeposit(action) {
      if (!selectedDeposit) return;
      const remarks = document.getElementById('depositRemarks').value.trim();

      if (action === 'REJECT' && !remarks) {
        window.showToast('বাতিল করার জন্য কারণ উল্লেখ করুন।', 'error');
        return;
      }

      try {
        const res = await window.api.post(`/api/deposits/admin/${selectedDeposit.id}/verify`, {
          action,
          remarks
        });

        window.showToast(res.message || 'ভেরিফিকেশন সম্পন্ন হয়েছে।', 'success');
        closeDepositModal();
        loadDeposits();
      } catch (err) {
        window.showToast(err.message || 'ভেরিফিকেশন সম্পন্ন করা যায়নি।', 'error');
      }
    }

    loadDeposits();
  </script>
</body>
</html>
